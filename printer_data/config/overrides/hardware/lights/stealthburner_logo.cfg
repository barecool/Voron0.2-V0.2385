#############
# LED 26 LOGO
#############
#############################################
# LED Effects Animations StealthBurner Logo #
#############################################

[led_effect sb_logo_busy]
autostart:              false
frame_rate:             24
leds:
    neopixel:caselight (26)
layers:
    breathing  3 1 top (1,0,0)

[led_effect sb_logo_cleaning]
autostart:              false
frame_rate:             24
leds:
    neopixel:caselight (26)
layers:
    breathing  3 1 top (0.0, 0.02, 0.5)

[led_effect sb_logo_calibrating_z]
autostart:              false
frame_rate:             24
leds:
    neopixel:caselight (26)
layers:
        breathing  3 1 top (0.0, 0.0, 0.35)

[led_effect sb_logo_heating]
leds:
    neopixel:caselight (26)
autostart:              false
frame_rate:             24
layers:
     breathing  3 1 top (1, 0.18, 0)

[led_effect sb_logo_cooling]
leds:
    neopixel:caselight (26)
autostart:              false
frame_rate:             24
layers:
     breathing  3 1 top (0, 0, 1)

[led_effect sb_logo_homing]
autostart:              false
frame_rate:             24
leds:
    neopixel:caselight (26)
layers:
        breathing  3 1 top (0.0, 0.6, 0.2, 0.0)

[led_effect sb_logo_leveling]
autostart:              false
frame_rate:             24
leds:
    neopixel:caselight (26)
layers:
        breathing  3 1 top (0.5, 0.1, 0.4)

[led_effect sb_logo_meshing]
autostart:              false
frame_rate:             24
leds:
    neopixel:caselight (26)
layers:
        breathing  3 1 top (0.2, 1.0, 0.0)

[led_effect sb_logo_printing]
autostart:              false
frame_rate:             24
leds:
    neopixel:caselight (26)
layers:
    gradient  0.3  1 add (0.3, 0.0, 0.0),(0.3, 0.3, 0.0),(0.3, 0.1, 0.0)

[led_effect sb_logo_standby]
autostart:              false
frame_rate:             24
leds:
    neopixel:caselight (26)
layers:
        breathing  3 1 top (0.01, 0.01, 0.01)

[led_effect sb_logo_done_printing]
autostart:              false
frame_rate:             24
leds:
    neopixel:caselight (26)
layers:
        breathing  3 1 top (0.0, 1.0, 0.0)

[led_effect logo]
leds:
    neopixel:caselight (26)
autostart:                false
frame_rate:               24
layers:
    static 0  0 top (1.0,  1.0, 1.0)

#################################
# LED Macros StealthBurner Logo #
#################################
[gcode_macro logo_off]
gcode:
    SET_LED_EFFECT EFFECT=logo STOP=1

[gcode_macro logo_on]
gcode:
    SET_LED_EFFECT EFFECT=logo
