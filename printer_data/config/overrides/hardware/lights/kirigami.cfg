# LED Macros Kirigami #
#######################

[gcode_macro bed_led_on]
gcode:
    SET_LED_EFFECT EFFECT=bed_led

[gcode_macro bed_led_off]
gcode:
    SET_LED_EFFECT EFFECT=bed_led STOP=1

[gcode_macro bed_led_standby]
gcode:
    SET_LED_EFFECT EFFECT=bed_led_standby

[gcode_macro bed_led_heating]
gcode:
    SET_LED_EFFECT EFFECT=bed_led_heating



