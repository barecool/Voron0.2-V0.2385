#########################
# LED 22 LED SKIRT LH
# LED 23 LED SKIRT RH
#########################
#######################
## LED SKIRT RH Skirt Effects ##
#######################

[led_effect skirt_rh_busy]
autostart:              false
frame_rate:             24
leds:
    neopixel:caselight (23)
layers:
    breathing  3 1 top (1,0,0)

[led_effect skirt_rh_cleaning]
autostart:              false
frame_rate:             24
leds:
    neopixel:caselight (23)
layers:
    breathing  3 1 top (0.0, 0.02, 0.5)

[led_effect skirt_rh_calibrating_z]
autostart:              false
frame_rate:             24
leds:
    neopixel:caselight (23)
layers:
        breathing  3 1 top (0.0, 0.0, 0.35)

[led_effect skirt_rh_heating]
leds:
    neopixel:caselight (23)
autostart:              false
frame_rate:             24
layers:
     breathing  3 1 top (1, 0.18, 0)

[led_effect skirt_rh_cooling]
leds:
    neopixel:caselight (23)
autostart:              false
frame_rate:             24
layers:
     breathing  3 1 top (0, 0, 1)

[led_effect skirt_rh_homing]
autostart:              false
frame_rate:             24
leds:
    neopixel:caselight (23)
layers:
        breathing  3 1 top (0.0, 0.6, 0.2, 0.0)

[led_effect skirt_rh_leveling]
autostart:              false
frame_rate:             24
leds:
    neopixel:caselight (23)
layers:
        breathing  3 1 top (0.5, 0.1, 0.4)

[led_effect skirt_rh_meshing]
autostart:              false
frame_rate:             24
leds:
    neopixel:caselight (23)
layers:
        breathing  3 1 top (0.2, 1.0, 0.0)

[led_effect skirt_rh_printing]
autostart:              false
frame_rate:             24
leds:
    neopixel:caselight (23)
layers:
    gradient  0.3  1 add (0.3, 0.0, 0.0),(0.3, 0.3, 0.0),(0.3, 0.1, 0.0)

[led_effect skirt_rh_standby]
autostart:              false
frame_rate:             24
leds:
    neopixel:caselight (23)
layers:
        breathing  3 1 top (0.01, 0.01, 0.01)

[led_effect skirt_rh_done_printing]
autostart:              false
frame_rate:             24
leds:
    neopixel:caselight (23)
layers:
        breathing  3 1 top (0.0, 1.0, 0.0)

[led_effect skirt_rh]
leds:
    neopixel:caselight (23)
autostart:                false
frame_rate:               24
layers:
    static 0  0 top (1.0,  1.0, 1.0)

######################################
# LED Macros SKIRT RH #
######################################
[gcode_macro set_skirt_rh_off]
gcode:
    SET_LED_EFFECT _EFFECT=skirt_rh STOP=1

[gcode_macro set_skirt_rh_on]
gcode:
    SET_LED_EFFECT _EFFECT=skirt_rh