#########################
# LED 24-25 NOZZLE LED
#########################
###############################################
# LED Effects Animations StealthBurner Nozzle #
###############################################

[led_effect sb_nozzle_heating]
autostart:              false
frame_rate:             24
leds:
    neopixel:caselight (24-25) #neopixel:caselight (2,3)
layers:
        breathing  3 1 top (1.0, 0.18, 0.0, 0.0)

[led_effect sb_nozzle_cooling]
autostart:              false
frame_rate:             24
leds:
    neopixel:caselight (24-25) #neopixel:caselight (2,3)
layers:
        breathing  3 1 top (0.0, 0.0, 1.0, 0.1)

[led_effect sb_nozzle_standby]
autostart:              false
frame_rate:             24
leds:
    neopixel:caselight (24-25) #neopixel:caselight (2,3)
layers:
        breathing  3 1 top (0.6, 0.0, 0.0, 0.0)

[led_effect sb_nozzle_done_printing]
autostart:              false
frame_rate:             24
leds:
    neopixel:caselight (24-25) #neopixel:caselight (2,3)
layers:
        breathing  3 1 top (0.6, 1.0, 0.0, 0.1)

[led_effect nozzle]
leds:
    neopixel:caselight (24-25) #neopixel:caselight (2,3)
   #neopixel:caselight
autostart:                false
frame_rate:               24
layers:
    static 0  0 top (0.0,  0.0, 0.0, 1.0)


###################################
# LED Macros StealthBurner Nozzle #
###################################
[gcode_macro nozzle_on]
gcode:
    SET_LED_EFFECT EFFECT=nozzle

[gcode_macro nozzle_off]
gcode:
    SET_LED_EFFECT EFFECT=nozzle STOP=1
