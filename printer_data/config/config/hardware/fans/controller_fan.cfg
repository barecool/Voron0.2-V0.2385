[duplicate_pin_override]
pins: CONTROLLER_FAN

[temperature_fan Rpi_MCU_Fan]
pin: CONTROLLER_FAN
kick_start_time: 0.5
#heater: heater_bed
#fan_speed: 1.0
off_below: 0.2
max_power: 1.0
sensor_type: temperature_host
control: pid
min_temp: 0
max_temp: 70
#max_delta: 5.0
pid_kp: 1.0
pid_ki: 0.5
pid_kd: 2.0
min_speed: 0
max_speed: 1.0
target_temp: 40
cycle_time: 0.010 # Default 0.010

[controller_fan controller_fan]
pin: CONTROLLER_FAN
kick_start_time: 0.5
fan_speed: 1.0
idle_timeout: 60
