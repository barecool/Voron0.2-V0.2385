############################################# \
######## USER CONFIG OVERRIDES FILE #########  + --> This will help you personalize my config to your printer :)
############################################# /

# This file is yours! Feel free to edit it in order to include all the needed
# things to adapt my generic config to your machine. This file will not be erased
# when updating the config using moonraker and it will be kept as you've set it.
# You can change every section of the config. You can also add some new custom macros, etc...
# The corresponding documentation can be found in: docs > overrides.md

### Also, keep in mind: if you use a multi-MCU config such as the old school double SKRs or a CANbus toolhead
### board, you will need to specify which components are connected to which board in your own mcu.cfg file!
### Example: if something is connected to the toolhead MCU, you should use "config_pin: toolhead:PIN_NAME".

#> Main control MCUs are called "mcu" (and "secondary" when using a double MCU configuration)
#> Toolhead CANboard MCUs are called "toolhead"
#> MMU/ERCF MCUs are called "mmu" 

# ------------------------------------------------------------------------------------------

[include overrides/hardware/lights/*.cfg]
# MACROS
# [include overrides/macros/base/homing/*.cfg]
[include overrides/macros/hardware_functions/status_leds.cfg]
[include macros/calibration/test_speed.cfg]

# [resonance_tester]

[firmware_retraction]
retract_length: 0.75 #0.4
unretract_extra_length: 0
retract_speed: 50 #30
unretract_speed: 30 #30

#-------------------------#
#   START_PRINT SEQUENCE  #
#-------------------------#

## The START_PRINT sequence is modular and fully customizable. A default START_PRINT sequence is auto-populated based on
## your probe choice (TAP, Dockable, Inductive), but if for some reasons you still want to modify it, please uncomment the following 3
## lines to define a new `variable_startprint_actions`. You can use any number of action or even duplicate some actions if needed.
## Available actions: "bed_soak", "extruder_preheating", "chamber_soak", "extruder_heating", "tilt_calib", "z_offset", "bedmesh", "purge", "clean", "primeline"
##
# [gcode_macro _USER_VARIABLES]
# variable_startprint_actions: "action1", "action2", ...
# gcode: # do not remove this line
[gcode_macro _USER_VARIABLES]
variable_probe_type_enabled: "none"
variable_startprint_actions: "bed_soak", "extruder_preheating", "chamber_soak", "extruder_heating", "purge", "clean", "z_offset", "primeline"
gcode:


#-------------------------#
#   EXTRUDER/BED PIDs     #
#-------------------------#

## Here is an example of some overrides for the PIDs. I put them here as almost everyone will use them,
## so just uncomment the following lines and change the values according to your own machine
# [extruder]
# control: pid
# pid_kp: 26.015
# pid_ki: 1.770
# pid_kd: 95.603

# [heater_bed]
# control: pid
# pid_kp: 38.771
# pid_ki: 1.746
# pid_kd: 215.177


#-------------------------#
#   Z MOTORS DIRECTION    #
#-------------------------#

## Here is an example of some overrides for the motor directions as it's a pretty common one. If you need
## to invert the Z1 or Z3 motor direction on your machine, just uncomment the following lines.
# [stepper_z1]
# dir_pin: !Z1_DIR

# [stepper_z3]
# dir_pin: !Z3_DIR


#-------------------------#
#   Probe Offsets         #
#-------------------------#

## Here is an example of some overrides for bed probes. These frequently have calibrated offsets for xyz,
## and many will need them during setup. If you need to set these, just uncomment the following lines.
# [probe]
# x_offset: -1.85
# y_offset: 29.3
# z_offset: 12.6

[gcode_macro LED_CONTROL]
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Nevermind just close this >>>"
    RESPOND TYPE=command MSG="action:prompt_text Kill Lights?"
    RESPOND TYPE=command MSG="action:prompt_footer_button LEDS_OFF|STATUS_OFF"
    RESPOND TYPE=command MSG="action:prompt_footer_button LEDS_ON|STATUS_PRINTING|error"
    RESPOND TYPE=command MSG="action:prompt_show"
    
[gcode_macro COOL_DOWN]
gcode:
    TURN_OFF_HEATERS
    SET_FAN_SPEED FAN=filter SPEED=1
    M106 S255

[delayed_gcode COOLING_WAIT]
initial_duration: 0
gcode:
  {% set ACTUAL_TEMP = printer.heater_bed.temperature|int %}
  {% set temp = printer["gcode_macro COOLING_START"].target_temp %}
  M117 Cooling bed to {temp}, currently at {ACTUAL_TEMP}
  RESPOND MSG="Cooling bed to {temp} currently at {ACTUAL_TEMP}"
  {% if ACTUAL_TEMP <= temp %}
    RESPOND MSG="Cooling done! Temperature is now {ACTUAL_TEMP}, goal is {temp}."
    COOLING_END
  {% else %}
    RESPOND MSG="Cooling still going - temperature is now {ACTUAL_TEMP}, goal is {temp}."
    COOL_DOWN
    UPDATE_DELAYED_GCODE ID=COOLING_WAIT DURATION=10
  {% endif %}

[gcode_macro COOLING_START]
variable_target_temp: 0
gcode:
  {% set temp = params.TEMP|default(50)|float %}
  SET_GCODE_VARIABLE MACRO=COOLING_START VARIABLE=target_temp VALUE={temp}
  STATUS_LEDS COLOR="COOLING"
  M117 Cooling bed to {temp}
  RESPOND MSG="Cooling bed to {temp}"
  UPDATE_DELAYED_GCODE ID=COOLING_WAIT DURATION=1


[gcode_macro COOLING_END]
gcode:
  UPDATE_DELAYED_GCODE ID=COOLING_WAIT DURATION=0
  # SET_FAN_SPEED FAN=exhaust_fan SPEED=0
  # SET_FAN_SPEED FAN=Nevermore SPEED=0
  SET_FAN_SPEED FAN=filter SPEED=0
  M106 S0
  M117 Ready to extract parts and print again!
  RESPOND MSG="Ready to extract parts and print again!"
  # STATUS_READY
  STATUS_LEDS COLOR="STANDBY"
  M117 COOLING DONE
  G4 P600
  STATUS_OFF

#####################################################################
#  Init Macro
#####################################################################
[delayed_gcode _INIT]
initial_duration: 1.5
gcode:
    _USER_VARIABLES
    {% set user       = printer['gcode_macro _USER_VARIABLES'] %}
    {action_respond_info("Initializing User Variables")}
    {action_respond_info("Loaded User Variables: \"%s\" " % user)}
    {action_respond_info("Checking Configuration for Consistency ")}

[gcode_macro _EXECUTE_AT_INIT]
description: Helper: Everything that should run at klipper start
gcode:
  {% set user = printer['gcode_macro _USER_VARIABLES'] %}
  {% if 'gcode_macro _MENU_LIMITS' is in printer %} _MENU_LIMITS INDEX=4 {% endif %}
  {% if printer.save_variables.variables.filament_sensor %} _RESTORE_FILAMENT_SENSOR {% endif %}
  {% if user.hw.filter.ena %} _CHECK_FILTER {% endif %}
  {% if user.hw.relay.ena %} _HEATER_ON {% endif %}
  {% if user.hw.display.ena %} UPDATE_DELAYED_GCODE ID=_DISPLAY_INIT DURATION=2 {% endif %}
  # startup_light
  
#   _PRINT_AR T="Klipper INIT done" SHOW_LCD=true

[gcode_macro _CHECK_CONSITENT]
description: Helper: Check that some criterias are meet in the printer.cfg
gcode:
  {% set user = printer['gcode_macro _USER_VARIABLES'] %}
  {% set text = ["CONFIG: ERROR"] %}
  {% if user.run is not defined %}
    {% set _dummy = text.append("_USER_VARIABLES macro missing") %}
  {% elif not user.run %}
    {% set _dummy = text.append("_USER_VARIABLES macro not executed") %}
  {% endif %}
  {% if 'save_variables' not in printer %}
    {% set _dummy = text.append("[save_variables] missing") %}
  {% endif %}
  {% if 'virtual_sdcard' not in printer %}
    {% set _dummy = text.append("[virtual_sdcard] missing") %}
  {% endif %}
  {% if text|length > 1 %}
    {action_respond_info(text|join("\n"))}
  {% endif %}

[gcode_macro _INIT_USERCUSTOM]
gcode:
    {% if printer["gcode_macro _USER_VARIABLES"].status_leds_enabled or printer["gcode_macro _USER_VARIABLES"].status_leds_caselight_enabled %}
        {% if printer["gcode_macro _USER_VARIABLES"].caselight_on_at_startup|default(False) %}
            STATUS_LEDS COLOR="STARTUP"
        {% else %}
            STATUS_LEDS COLOR="OFF"
        {% endif %}
    {% endif %}

## PrusaSlicer/SuperSlicer:
## Add at the start gcode section
## _LAYER TOTAL=[total_layer_count] RESPOND=0
##
## Add at the layer change gcode section
## _LAYER CURRENT={layer_num+1}
[gcode_macro _LAYER]
description: Pass the current layer and the total amount of layers by your Slicer.
variable_layer: {'current': 0, 'total':0}
gcode:
  {% set _dummy = layer.update({'total':params.TOTAL|int}) if ('TOTAL' in params and params.TOTAL|int > 0) %}
  {% set _dummy = layer.update({'current':params.CURRENT|default(0)|int}) %}
  SET_GCODE_VARIABLE MACRO=_LAYER VARIABLE=layer VALUE="{layer}"
  {% if params.RESPOND|default(printer['gcode_macro _USER_VARIABLES'].respond.layer)|int == 1 %}
    {action_respond_info("Layer %s of %s" % (layer.current, layer.total))}
  {% endif %}

[gcode_macro TOGGLE_LAYER_OUTPUT]
description: Enable/Disable Console output of _LAYER
gcode:
  {% set respond = printer['gcode_macro _USER_VARIABLES'].respond %}
  {% set _dummy = respond.update({'layer':1}) if respond.layer|int == 0 else respond.update({'layer':0}) %}
  SET_GCODE_VARIABLE MACRO=_USER_VARIABLES VARIABLE=respond VALUE="{respond}"

[gcode_macro TEST_MICROSTEP_DRIFT]
gcode:
    G90
    G1 X50 Y50 Z25
    M400
    GET_POSITION
    DUMP_TMC STEPPER=stepper_z

    PROBE SAMPLES=70

    G1 X50 Y50 Z25
    M400
    GET_POSITION
    DUMP_TMC STEPPER=stepper_z

# [shaketune]
# result_folder: ~/printer_data/config/ShakeTune_results
# #    Path where the processed results will be stored. If the folder doesn't exist,
# #    it will be automatically created. You can change this if you'd like to store 
# #    results in a different location.
# number_of_results_to_keep: 10
# #    This setting defines how many results you want to keep in the result folder.
# #    Once the specified number is exceeded, older results will be automatically deleted
# #    to free up space on the SD card and avoid cluttering the results folder.
# keep_raw_data: False
# #    If set to True, Shake&Tune will store both the processed graphs and the raw accelerometer
# #    .stdata files in the results folder. This can be useful for debugging or archiving purposes.
# #    Please always attach them when reporting any issues on GitHub or Discord.
# show_macros_in_webui: True
# #    Mainsail and Fluidd doesn't create buttons for system commands (macros that are not part
# #    of the printer.cfg file). This option allow Shake&Tune to inject them into the webui at runtime.
# #    If set to False, the macros will be hidden but still accessible from the console by typing
# #    their names manually, which can be useful if you prefer to encapsulate them into your own macros.
# # timeout: 600
# #    This defines the maximum processing time (in seconds) to allows to Shake&Tune for generating 
# #    graphs from a .stdata file. 10 minutes should be more than enough in most cases, but if you have
# #    slower hardware (e.g., older SD cards or low-performance devices), increase it to prevent timeouts.
# measurements_chunk_size: 2
#    Each Shake&Tune command uses the accelerometer to take multiple measurements. By default,
#    Shake&Tune will write a chunk of data to disk every two measurements, and at the end of the
#    command will merge these chunks into the final .stdata file for processing. "2" is a very
#    conservative setting to avoid Klipper Timer Too Close errors on lower end devices with little
#    RAM, and should work for everyone. However, if you are using a powerful computer, you may
#    wish to increase this value to keep more measurements in memory (e.g., 15-20) before writing
#    the chunk and avoid stressing the filesystem too much.
# max_freq: 200
#    This setting defines the maximum frequency at which the calculation of the power spectral density
#    is cutoff. The default value should be fine for most machines and accelerometer combinations and
#    avoid touching it unless you know what you're doing.
# dpi: 300
#    Controls the resolution of the generated graphs. The default value of 300 dpi was optimized
#    and strikes a balance between performance and readability, ensuring that graphs are clear
#    without using too much RAM to generate them. Usually, you shouldn't need to change this value.

[gcode_macro _KNOMI_STATUS]
variable_homing: False
variable_probing: False
variable_qgling: False
variable_heating_nozzle: False
variable_heating_bed: False
gcode:

[gcode_macro M109]
rename_existing: M109.1
gcode:
  SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_nozzle VALUE=True
  M109.1 {rawparams}
  SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_nozzle VALUE=False

[gcode_macro M190]
rename_existing: M190.1
gcode:
  SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_bed VALUE=True
  M190.1 {rawparams}
  SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_bed VALUE=False

[gcode_macro G28]
rename_existing: G28.1
gcode:
  SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=True
  G28.1 {rawparams}
  SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=False

[delayed_gcode _CLEAR_DISPLAY]
gcode:
  M117