#-------------------------------------#
#### BTT SKR Mini E3 V3 definition ####
#-------------------------------------#

[mcu]
##--------------------------------------------------------------------
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_080022000F504B5735313920-if00
restart_method: command
##--------------------------------------------------------------------

[include config/mcu_definitions/main/BTT_SKR_Mini_E3_v3.cfg] # Do not remove this line
[board_pins SKR_mini_e3_mcu]
mcu: mcu
aliases:
    X_STEP=MCU_XM_STEP , X_DIR=MCU_XM_DIR , X_ENABLE=MCU_XM_ENABLE ,
    Y_STEP=MCU_YM_STEP , Y_DIR=MCU_YM_DIR , Y_ENABLE=MCU_YM_ENABLE ,
    Z_STEP=MCU_ZM_STEP , Z_DIR=MCU_ZM_DIR , Z_ENABLE=MCU_ZM_ENABLE ,
    E_STEP=MCU_EM_STEP , E_DIR=MCU_EM_DIR , E_ENABLE=MCU_EM_ENABLE ,

    TMCUART=MCU_TMCUART , TMCTX=MCU_TMCTX ,

    X_STOP=MCU_XSTOP , Y_STOP=MCU_YSTOP , Z_STOP=MCU_ZSTOP ,
    #RUNOUT_SENSOR=MCU_E0STOP ,
    PROBE_INPUT=MCU_PROBE    ,
    SERVO_PIN=MCU_SERVOS     ,

    E_HEATER=MCU_HE0   , E_TEMPERATURE=MCU_TH0   ,
    #BED_HEATER=MCU_BED , BED_TEMPERATURE=MCU_THB ,
    BED_HEATER=PC12 , BED_TEMPERATURE=MCU_THB ,

    PART_FAN=MCU_FAN0 , E_FAN=MCU_FAN1 , CONTROLLER_FAN=MCU_FAN2 ,
    FILTER_FAN=MCU_BED ,
    CHAMBER_TEMPERATURE=MCU_SPI1_MOSI,
    
    #STATUS_NEOPIXEL=MCU_NEOPIXEL ,
    LIGHT_NEOPIXEL=MCU_NEOPIXEL  ,
    BEEPER=EXP1_10, 
    


[tmc2209 stepper_x]
#LDO-35STH52-1504AH - NEMA14
uart_pin: TMCUART
tx_pin: TMCTX
uart_address: 0
run_current: 0.39 #0.37
diag_pin: ^MCU_XSTOP
driver_SGTHRS: 110 
interpolate: True

[tmc2209 stepper_y]
# LDO-35STH52-1504AH - NEMA14
uart_pin: TMCUART
tx_pin: TMCTX
uart_address: 2
run_current: 0.39 #0.37 TEST_SPEED: starting 5 iterations at speed 400, accel 8000
diag_pin: ^MCU_YSTOP
driver_SGTHRS: 110
interpolate: True

[tmc2209 stepper_z]
uart_pin: TMCUART
tx_pin: TMCTX
interpolate: True
uart_address: 1
## For LDO-42STH25-1004CL200E 1.0A #LDO V0.1 Teflon coated 8x8 leadscrew Z motor
run_current: 0.43 #0.37

# Comment this section if you are using a toolhead with its own MCU
[tmc2209 extruder]
#LDO 36STH17-1004AHG 1A 1.8° - NEMA14 36mm Pancake Motor
uart_pin: TMCUART
tx_pin: TMCTX
uart_address: 3
# For OMC (StepperOnline) 14HR07-1004VRN 1A 0.9°
# run_current: 0.5   # for OMC 14HR07-1004VRN rated at 1A
# For LDO LDO 36STH17-1004AHG 1A 1.8° 
run_current: 0.3  


